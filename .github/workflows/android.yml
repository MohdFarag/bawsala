name: Android

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android
    shell: bash

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # test report annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/kotlin.json"

      - name: Test
        run: set -o pipefail; ./gradlew -p core test ktfmtCheck --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Explain failure
        if: failure()
        run: ../.github/scripts/gradle-failure-annotations.sh "$RUNNER_TEMP/gradle.log"
      - name: Test report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: android/core/build/test-results/test/*.xml
          check_name: Core test results

  app:
    name: App build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: echo "::add-matcher::${GITHUB_WORKSPACE}/.github/problem-matchers/kotlin.json"

      - name: Unit tests, lint, debug and release (R8) builds
        run: |
          set -o pipefail
          # -Proborazzi.test.record=true also saves the V3 screenshots (phase 7) during the unit tests.
          ./gradlew :app:ktfmtCheck :app:testDebugUnitTest -Proborazzi.test.record=true :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Explain failure
        if: failure()
        run: ../.github/scripts/gradle-failure-annotations.sh "$RUNNER_TEMP/gradle.log"
      - name: Lint warnings
        if: always()
        run: python3 ../.github/scripts/lint-warning-summary.py app/build/reports/lint-results-debug.xml
      - name: Test report
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: android/app/build/test-results/**/*.xml
          check_name: App test results

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bawsala-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload V3 screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v3-screenshots
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # Publishes the V3 screenshots (phase 7) to the v3-screenshots branch, one folder per PR, so they
  # can be compared with the Penpot boards without downloading artifacts. Only for PRs from this
  # repository; the build job above stays read-only.
  screenshots:
    name: Publish V3 screenshots
    continue-on-error: true
    needs: app
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.app.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: v3-screenshots
          path: shots
      - name: Push to the v3-screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init -q publish && cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin v3-screenshots; then git checkout -q FETCH_HEAD; else git checkout -q --orphan v3-screenshots; fi
          rm -rf "pr-${PR}" && mkdir -p "pr-${PR}" && cp -r ../shots/. "pr-${PR}/"
          echo "${SHA}" > "pr-${PR}/COMMIT"
          git add -A
          git commit -q -m "Screenshots for PR #${PR} at ${SHA}" || exit 0
          git push -q origin HEAD:refs/heads/v3-screenshots
