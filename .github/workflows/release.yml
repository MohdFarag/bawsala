name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  target:
    name: Resolve release tag
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      published: ${{ steps.target.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: target
        env:
          FROM_RP: ${{ needs.release-please.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${FROM_RP:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          [[ "$(git show "$tag:version.txt")" == "${tag#v}" ]]
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "published=$([[ "$draft" == false ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  validation:
    name: Release validation
    needs: target
    if: ${{ !cancelled() && needs.target.result == 'success' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: write
      checks: write
      pull-requests: write
      security-events: write
      actions: read
    with:
      ref: ${{ needs.target.outputs.sha }}
      force_full: true
      device_suite: smoke

  android:
    name: Verify Android packages
    needs: [target, validation]
    if: ${{ !cancelled() && needs.validation.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    env:
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      VERSION_NAME: ${{ needs.target.outputs.tag }}
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Prepare version and signing
        if: needs.target.outputs.published != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing official release configuration: $name"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed packages
        if: needs.target.outputs.published != 'true'
        env:
          OFFICIAL_RELEASE: "true"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          SERVER_URL: ${{ vars.API_SERVER_URL }}
        run: |
          set -euo pipefail
          [[ -n "$SERVER_URL" ]] || { echo '::error::API_SERVER_URL is required'; exit 1; }
          ./gradlew :app:assembleRelease :app:bundleRelease -PserverUrl="$SERVER_URL" --stacktrace
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab release-artifacts/
          (cd release-artifacts && sha256sum app-release.apk app-release.aab > SHA256SUMS.txt)
      - name: Download immutable published packages on rerun
        if: needs.target.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.target.outputs.tag }}
        run: gh release download "$TAG" --dir release-artifacts --pattern app-release.apk --pattern app-release.aab --pattern SHA256SUMS.txt
      - name: Verify signatures, version and checksums
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          bash ../.github/scripts/verify-android.sh release-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-android
          path: android/release-artifacts/
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  server-image:
    name: Stage server image
    needs: [target, validation]
    if: ${{ !cancelled() && needs.validation.result == 'success' && needs.target.outputs.published != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          tags: ghcr.io/${{ github.repository }}/server:candidate-${{ needs.target.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify staged image starts with PostgreSQL
        env:
          IMAGE: ghcr.io/${{ github.repository }}/server@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/smoke-image.sh

  publish:
    name: Publish verified release
    needs: [target, validation, android, server-image]
    if: ${{ !cancelled() && needs.validation.result == 'success' && needs.android.result == 'success' && (needs.server-image.result == 'success' || (needs.target.outputs.published == 'true' && needs.server-image.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-${{ needs.target.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-android
          path: packages
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attach all files before publishing; never overwrite a published release
        if: needs.target.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.target.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}/server
          DIGEST: ${{ needs.server-image.outputs.digest }}
        run: |
          set -euo pipefail
          (cd packages && sha256sum --check SHA256SUMS.txt)
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-state; then
            [[ "$(cat release-state)" == true ]] || { echo '::error::Release was already published'; exit 1; }
          else
            gh release create "$TAG" --draft --generate-notes --verify-tag
          fi
          gh release upload "$TAG" --clobber packages/app-release.apk packages/app-release.aab packages/SHA256SUMS.txt
          docker buildx imagetools create --tag "$IMAGE:${TAG#v}" "$IMAGE@$DIGEST"
          gh release edit "$TAG" --draft=false --latest
      - name: Promote stable image aliases (also repairs an interrupted publication)
        env:
          TAG: ${{ needs.target.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}/server
        run: |
          set -euo pipefail
          version="${TAG#v}"
          docker buildx imagetools create --tag "$IMAGE:${version%.*}" --tag "$IMAGE:latest" "$IMAGE:$version"
