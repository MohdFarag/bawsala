[versions]
agp = "8.7.3"
kotlin = "2.4.21"
compose-bom = "2024.12.01"
core-ktx = "1.15.0"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
work = "2.10.0"
roborazzi = "1.32.2"
robolectric = "4.14.1"
coroutines = "1.11.0"
# 0.0.6+ is compiled for Java 21; 0.0.5 targets Java 17 like the rest of the app.
adhan = "0.0.5"
json = "20260814"
# Google Identity Services: AuthorizationClient for Sign in with Google with Tasks/Calendar scopes.
play-services-auth = "21.3.0"
ktfmt-plugin = "0.27.0"

[libraries]
glance-appwidget = { module = "androidx.glance:glance-appwidget", version = "1.1.1" }
# Screenshot tests (V3 phase 7): Compose rendered by Robolectric, captured by Roborazzi.
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
junit4 = { module = "junit:junit", version = "4.13.2" }
junit-vintage = { module = "org.junit.vintage:junit-vintage-engine", version = "5.11.4" }
# Included build (android/core), substituted by Gradle; no version needed.
bawsala-core = { module = "app.bawsala:core" }
adhan = { module = "com.batoulapps.adhan:adhan2", version.ref = "adhan" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "play-services-auth" }
org-json = { module = "org.json:json", version.ref = "json" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Formatting with ktfmt in the official Kotlin style; CI runs ktfmtCheck.
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt-plugin" }
